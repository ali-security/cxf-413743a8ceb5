name: seal-build

# Upstream Apache CXF 3.0.0-milestone1 ships no GitHub Actions CI; this workflow
# reproduces the project's own Maven build (BUILDING.txt: `mvn install`) for the
# rt/transports/http module on the JDK 6 toolchain the release was built with,
# runs that module's full surefire suite, and then the HTTP-transport systests
# that exercise the servlet / service-listing / hostname-verification code.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_OPTS: "-Xmx2g -XX:MaxPermSize=512m"
      MVN_FLAGS: "-B -e -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true -Dcpd.skip=true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 6
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "6"

      - name: Install Maven 3.2.5 (last Maven line that runs on JDK 6)
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.2.5/binaries/apache-maven-3.2.5-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.2.5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven mirror (JDK 6 cannot negotiate TLS 1.2 with Central)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>central-http</id>
                <mirrorOf>*</mirrorOf>
                <url>http://insecure.repo1.maven.org/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          java -version
          mvn -version

      - name: Build and test rt/transports/http (full module suite)
        if: ${{ inputs.test-filter == '' }}
        run: mvn clean install -pl rt/transports/http $MVN_FLAGS

      - name: Build and test rt/transports/http (filtered)
        if: ${{ inputs.test-filter != '' }}
        run: mvn clean install -pl rt/transports/http $MVN_FLAGS -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false

      # JAXRSServicesListingTest is introduced by a later upstream CVE fix port and
      # does not exist in the unpatched base; selecting it by name lets the same
      # recipe run it once the patch set is applied.
      - name: systests/jaxrs - JAXRSClientServerSpringBookTest, JAXRSServicesListingTest
        if: ${{ inputs.test-filter == '' }}
        run: |
          find systests/jaxrs/src/test/java -name 'JAXRSClientServerSpringBookTest.java' -o -name 'JAXRSServicesListingTest.java'
          mvn test -pl systests/jaxrs $MVN_FLAGS -Dtest=JAXRSClientServerSpringBookTest,JAXRSServicesListingTest -DfailIfNoTests=false

      # JAXWSServicesListingTest is likewise introduced by a later upstream CVE fix port.
      - name: systests/ws-specs - JAXWSServicesListingTest
        if: ${{ inputs.test-filter == '' }}
        run: |
          find systests/ws-specs/src/test/java -name 'JAXWSServicesListingTest.java'
          mvn test -pl systests/ws-specs $MVN_FLAGS -Dtest=JAXWSServicesListingTest -DfailIfNoTests=false

      - name: Print surefire summaries
        if: always()
        run: |
          for f in $(find rt/transports/http/target/surefire-reports systests/jaxrs/target/surefire-reports systests/ws-specs/target/surefire-reports -name 'TEST-*.xml' 2>/dev/null); do
            grep -o '<testsuite [^>]*' "$f" | sed -E 's/.*name="([^"]*)".*tests="([^"]*)".*/\1 tests=\2/' | head -1
            if grep -q '<skipped' "$f"; then grep -B1 -A1 '<skipped' "$f"; fi
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cxf-rt-transports-http
          path: rt/transports/http/target/cxf-rt-transports-http-*.jar
          if-no-files-found: error
